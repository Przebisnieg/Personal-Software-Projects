<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Biletów</title>
    <style>
        
        :root {
            --kolor-niebieski: #007aff;
            --kolor-pomaranczowy: #ff9500;
            --kolor-tla: #f0f2f5;
            --kolor-karty: #ffffff;
            --kolor-tekstu: #1d1d1f;
            --kolor-tekstu-subtelny: #6e6e73;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--kolor-tla);

            /* --- OBRAZ W TLE --- */
            background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
/*url('https://images.unsplash.com/photo-1554147090-e1221a04a025?q=80&w=2070&auto=format&fit=crop');*/

url('https://www.arcanagis.pl/wp-content/uploads/2016/03/grafika-na-TOP_PKP-PLK.jpg');


            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: var(--kolor-karty);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1, h2 { color: var(--kolor-tekstu); border-bottom: 2px solid var(--kolor-niebieski); padding-bottom: 10px; }
        h2 { font-size: 1.5rem; border-bottom: none; }
        
        label { font-weight: 600; color: var(--kolor-tekstu-subtelny); }
        
        .input-group, .result-group { margin-bottom: 25px; }
        
        .result-group { padding: 20px; text-align: center; background-color: #f0f8ff; border-radius: 8px; }
        .result-label { color: var(--kolor-niebieski); font-size: 1rem; }
        .result-value { font-size: 2rem; font-weight: 700; color: var(--kolor-niebieski); display: block; }
        
        input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1.2rem; box-sizing: border-box; }
        input[type="number"]:focus { border-color: var(--kolor-niebieski); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.25); outline: none; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e5e5; }
        td { vertical-align: middle; }
        
        .znizka-input { width: 90px; text-align: right; }
        .cena-output { font-weight: bold; font-size: 1.1rem; }

        button { border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.2s ease-in-out; }
        
        .przycisk-dodaj { background-color: var(--kolor-niebieski); color: white; display: block; width: 100%; margin-top: 20px; }
        .przycisk-dodaj:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }

        .przycisk-usun { background-color: var(--kolor-pomaranczowy); color: white; }
        .przycisk-usun:hover { background-color: #ff7b00; transform: scale(1.05); }

    </style>
</head>
<body>

<div class="container">
    <h1>Kalkulator Biletów</h1>

    <div class="input-group">
        <label for="suma_input">Całkowita Suma:</label>
        <input type="number" id="suma_input" value="1000" oninput="obliczWszystko()">
    </div>

    <div class="result-group">
        <span class="result-label">Cena Bazowa</span>
        <span class="result-value" id="cena_bazowa_output">0.00 zł</span>
    </div>

    <h2>Twoje Bilety</h2>
    <table id="bilety_tabela">
        <thead>
            <tr>
                <th>Zniżka %</th>
                <th>Cena Biletu</th>
                <th>Akcja</th> <!-- Nowa kolumna na przycisk usuwania -->
            </tr>
        </thead>
        <tbody id="bilety_tbody"></tbody>
    </table>
    <button class="przycisk-dodaj" onclick="dodajWiersz()">Dodaj Bilet</button>

</div>

<script>
    function obliczWszystko() {
        const suma = parseFloat(document.getElementById('suma_input').value) || 0;
        const zniczkiInputy = document.querySelectorAll('.znizka-input');

        let sumaMnoznikow = 0;
        zniczkiInputy.forEach(input => {
            sumaMnoznikow += (1 - (parseFloat(input.value) || 0) / 100);
        });
        
        const cenaBazowa = sumaMnoznikow !== 0 ? suma / sumaMnoznikow : 0;
        document.getElementById('cena_bazowa_output').textContent = `${cenaBazowa.toFixed(2)} zł`;

        zniczkiInputy.forEach(input => {
            const cenaBiletu = cenaBazowa * (1 - (parseFloat(input.value) || 0) / 100);
            const wiersz = input.closest('tr');
            wiersz.querySelector('.cena-output').textContent = `${cenaBiletu.toFixed(2)} zł`;
        });
    }

    function usunWiersz(przycisk) {
        const wierszDoUsuniecia = przycisk.closest('tr'); // Znajdź wiersz, w którym jest kliknięty przycisk
        wierszDoUsuniecia.remove(); // Usuń ten wiersz z tabeli
        obliczWszystko(); // Przelicz wszystko od nowa
    }

    function dodajWiersz(wartoscZniczki = 100) {
        const tbody = document.getElementById('bilety_tbody');
        const nowyWiersz = tbody.insertRow();
        const komorkaZniczki = nowyWiersz.insertCell();
        const komorkaCeny = nowyWiersz.insertCell();
        const komorkaAkcji = nowyWiersz.insertCell(); // Dodaj komórkę na przycisk

        inputZniczki = document.createElement('input');
        inputZniczki.type = 'number';
        inputZniczki.className = 'znizka-input';
        inputZniczki.value = wartoscZniczki;
        inputZniczki.oninput = obliczWszystko;
        
        outputCeny = document.createElement('span');
        outputCeny.className = 'cena-output';

        // --- STWORZENIE PRZYCISKU USUWANIA ---
        const przyciskUsun = document.createElement('button');
        przyciskUsun.textContent = 'Usuń';
        przyciskUsun.className = 'przycisk-usun';
        przyciskUsun.onclick = function() { usunWiersz(this); }; // 'this' odnosi się do klikniętego przycisku

        komorkaZniczki.appendChild(inputZniczki);
        komorkaCeny.appendChild(outputCeny);
        komorkaAkcji.appendChild(przyciskUsun); // Umieść przycisk w komórce
    }

    window.onload = function() {
        dodajWiersz(20);
        dodajWiersz(50);
        obliczWszystko();
    };
</script>

</body>
</html>
